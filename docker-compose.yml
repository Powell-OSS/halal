services:
  db:
    image: postgres:16-alpine
    container_name: halal-db
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: halal
    volumes:
      - halal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d halal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  halal_db_data:
